name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: cargo check (strict warnings)
        env:
          RUSTFLAGS: "-D warnings"
        run: cargo check --all-targets --locked

      - name: cargo check (local-only, no default features)
        env:
          RUSTFLAGS: "-D warnings"
        run: cargo check --no-default-features --locked

      - name: cargo test
        run: cargo test --locked

      - name: cargo test (local-only, no default features)
        run: cargo test --no-default-features --locked

  security:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Run audit
        run: cargo audit

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain (with clippy + rustfmt)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: cargo fmt check
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: cargo doc (strict warnings)
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --no-deps --all-features --locked

  differential:
    name: Differential conformance (vs delta-rs)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Build deltalens
        run: cargo build --release --locked

      - name: Run delta-rs differential test suite
        run: uv run --with deltalake --with pyarrow python3 scripts/diff_test.py

  spark-dat:
    name: Spark DAT conformance (delta-incubator/dat)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache Spark DAT v0.0.3 corpus
        uses: actions/cache@v6
        with:
          path: .dat-cache
          key: spark-dat-v0.0.3-19c045bc

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Build deltalens
        run: cargo build --release --locked

      - name: Run official Spark DAT conformance suite
        run: uv run --with deltalake --with pyarrow python3 scripts/dat_test.py --dat-dir .dat-cache

  cloud-s3:
    name: Cloud S3 integration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Run S3 integration tests
        run: uv run --with "moto[server]" --with boto3 python3 scripts/run_s3_test.py

  cloud-gcs:
    name: Cloud GCS integration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Start fake-gcs-server (HTTP) and create test bucket
        run: |
          docker rm -f deltalens-fake-gcs || true
          docker run -d --name deltalens-fake-gcs -p 14443:4443 \
            fsouza/fake-gcs-server:latest -scheme http -port 4443 -external-url http://127.0.0.1:14443
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:14443/storage/v1/b >/dev/null; then break; fi
            sleep 0.5
          done
          curl -sf -X POST http://127.0.0.1:14443/storage/v1/b \
            -H "Content-Type: application/json" \
            -d '{"name":"deltalens-test"}'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Run GCS integration tests
        env:
          GOOGLE_SERVICE_ACCOUNT_KEY: '{"gcs_base_url":"http://127.0.0.1:14443","disable_oauth":true,"client_email":"","private_key":"","private_key_id":""}'
          DELTALENS_TEST_GCS_BUCKET: deltalens-test
        run: cargo test --test cloud_gcs --locked -- --ignored --nocapture

      - name: Stop fake-gcs-server
        if: always()
        run: docker rm -f deltalens-fake-gcs || true

  cloud-azure:
    name: Cloud Azure (Azurite) integration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Start Azurite and create test container
        run: |
          docker rm -f deltalens-azurite || true
          docker run -d --name deltalens-azurite -p 10000:10000 \
            mcr.microsoft.com/azure-storage/azurite azurite-blob --blobHost 0.0.0.0 --blobPort 10000 --skipApiVersionCheck
          python3 -c '
          import base64, datetime, hashlib, hmac, time, urllib.request
          key = base64.b64decode("Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==")
          ver = "2020-10-02"
          for attempt in range(40):
              date = datetime.datetime.now(datetime.timezone.utc).strftime("%a, %d %b %Y %H:%M:%S GMT")
              sts = f"PUT\n\n\n\n\n\n\n\n\n\n\n\nx-ms-date:{date}\nx-ms-version:{ver}\n/devstoreaccount1/deltalens-test\nrestype:container"
              sig = base64.b64encode(hmac.new(key, sts.encode(), hashlib.sha256).digest()).decode()
              req = urllib.request.Request(
                  "http://127.0.0.1:10000/devstoreaccount1/deltalens-test?restype=container",
                  method="PUT",
                  headers={"x-ms-date": date, "x-ms-version": ver, "Authorization": f"SharedKey devstoreaccount1:{sig}", "Content-Length": "0"},
              )
              try:
                  with urllib.request.urlopen(req, timeout=5) as r:
                      assert r.status in (200, 201), r.status
                  print(f"Azurite container created on attempt {attempt + 1}")
                  break
              except Exception as exc:
                  if attempt == 39:
                      raise
                  time.sleep(0.5)
          '

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Run Azure integration tests
        env:
          AZURE_STORAGE_USE_EMULATOR: "true"
          AZURITE_BLOB_STORAGE_URL: "http://127.0.0.1:10000"
          DELTALENS_TEST_AZURE_CONTAINER: deltalens-test
        run: cargo test --test cloud_azure --locked -- --ignored --nocapture

      - name: Stop Azurite
        if: always()
        run: docker rm -f deltalens-azurite || true
