name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: cargo check (strict warnings)
        env:
          RUSTFLAGS: "-D warnings"
        run: cargo check --all-targets --locked

      - name: cargo check (local-only, no default features)
        env:
          RUSTFLAGS: "-D warnings"
        run: cargo check --no-default-features --locked

      - name: cargo test
        run: cargo test --locked

      - name: cargo test (local-only, no default features)
        run: cargo test --no-default-features --locked

  security:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Run audit
        run: cargo audit

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain (with clippy + rustfmt)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: cargo fmt check
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: cargo doc (strict warnings)
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --no-deps --all-features --locked

  differential:
    name: Differential conformance (vs delta-rs)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Build deltalens
        run: cargo build --release --locked

      - name: Run delta-rs differential test suite
        run: uv run --with deltalake --with pyarrow python3 scripts/diff_test.py

  spark-dat:
    name: Spark DAT conformance (delta-incubator/dat)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache Spark DAT v0.0.3 corpus
        uses: actions/cache@v6
        with:
          path: .dat-cache
          key: spark-dat-v0.0.3-19c045bc

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Build deltalens
        run: cargo build --release --locked

      - name: Run official Spark DAT conformance suite
        run: uv run --with deltalake --with pyarrow python3 scripts/dat_test.py --dat-dir .dat-cache

  cloud-s3:
    name: Cloud S3 integration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Run S3 integration tests
        run: uv run --with "moto[server]" --with boto3 python3 scripts/run_s3_test.py

  cloud-gcs:
    name: Cloud GCS integration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Run GCS integration tests
        run: uv run --with "moto[server]" --with boto3 python3 scripts/run_gcs_test.py

  cloud-azure:
    name: Cloud Azure (Azurite) integration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Start Azurite and create test container
        run: |
          docker rm -f deltalens-azurite || true
          docker run -d --name deltalens-azurite -p 10000:10000 \
            mcr.microsoft.com/azure-storage/azurite azurite-blob --blobHost 0.0.0.0 --blobPort 10000 --skipApiVersionCheck
          uv run --with azure-storage-blob python3 -c '
          import time
          from azure.storage.blob import BlobServiceClient
          conn = (
              "DefaultEndpointsProtocol=http;"
              "AccountName=devstoreaccount1;"
              "AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;"
              "BlobEndpoint=http://127.0.0.1:10000/devstoreaccount1;"
          )
          client = BlobServiceClient.from_connection_string(conn)
          for attempt in range(40):
              try:
                  client.create_container("deltalens-test")
                  print(f"Azurite container created on attempt {attempt + 1}")
                  break
              except Exception:
                  if attempt == 39:
                      raise
                  time.sleep(0.5)
          '

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Run Azure integration tests
        env:
          AZURE_STORAGE_USE_EMULATOR: "true"
          AZURITE_BLOB_STORAGE_URL: "http://127.0.0.1:10000"
          DELTALENS_TEST_AZURE_CONTAINER: deltalens-test
        run: cargo test --test cloud_azure --locked -- --ignored --nocapture

      - name: Stop Azurite
        if: always()
        run: docker rm -f deltalens-azurite || true
