<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 560" width="920" height="560" role="img" aria-label="DeltaLens terminal demo showing inspect and breaking schema diff in 2.91ms">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <style>
      .mono { font-family: ui-monospace, 'SFMono-Regular', 'JetBrains Mono', Menlo, Consolas, monospace; font-size: 13px; }
      .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 12.5px; fill: #9ca3af; font-weight: 600; }
      .prompt { fill: #22d3ee; font-weight: 700; }
      .cmd { fill: #f9fafb; font-weight: 600; }
      .dim { fill: #6b7280; }
      .hdr { fill: #93c5fd; font-weight: 700; }
      .key { fill: #cbd5e1; }
      .val { fill: #f8fafc; }
      .ok { fill: #34d399; font-weight: 600; }
      .warn { fill: #fbbf24; font-weight: 600; }
      .err { fill: #f87171; font-weight: 700; }
      .pill-text { font-family: ui-monospace, Menlo, monospace; font-size: 11.5px; font-weight: 700; }
    </style>
  </defs>

  <!-- Outer window -->
  <rect x="0" y="0" width="920" height="560" rx="12" fill="url(#bg)" stroke="#30363d" stroke-width="1.5"/>

  <!-- Titlebar -->
  <rect x="0" y="0" width="920" height="38" rx="12" fill="#161b22"/>
  <rect x="0" y="24" width="920" height="14" fill="#161b22"/>
  <line x1="0" y1="38" x2="920" y2="38" stroke="#30363d" stroke-width="1"/>
  <circle cx="20" cy="19" r="6" fill="#ff5f56"/>
  <circle cx="40" cy="19" r="6" fill="#ffbd2e"/>
  <circle cx="60" cy="19" r="6" fill="#27c93f"/>
  <text x="460" y="23" text-anchor="middle" class="title">deltalens v2.0.1 — zero Spark · zero JVM · zero Python</text>

  <!-- Speed pill -->
  <rect x="752" y="9" width="154" height="20" rx="10" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
  <text x="829" y="23" text-anchor="middle" class="pill-text" fill="#6ee7b7">2.91 ms · 12.5 MB RSS</text>

  <!-- Command 1: inspect -->
  <text x="22" y="66" class="mono"><tspan class="prompt">$</tspan> <tspan class="cmd">deltalens inspect s3://warehouse/transactions</tspan></text>
  <text x="22" y="90" class="mono dim">┌─────────────────────────────┬──────────────────────────────────────────────────────────────────────┐</text>
  <text x="22" y="108" class="mono"><tspan class="dim">│</tspan> <tspan class="hdr">deltalens · Table Health</tspan>    <tspan class="dim">│</tspan> <tspan class="val">s3://warehouse/transactions   (v012 · reader=3, writer=7)</tspan>            <tspan class="dim">│</tspan></text>
  <text x="22" y="126" class="mono dim">├─────────────────────────────┼──────────────────────────────────────────────────────────────────────┤</text>
  <text x="22" y="144" class="mono"><tspan class="dim">│</tspan> <tspan class="key">Data Files / Total Size</tspan>     <tspan class="dim">│</tspan> <tspan class="val">14 files · 345.8 MB  (avg 24.7 MB · min 524 KB · max 134.2 MB)</tspan>       <tspan class="dim">│</tspan></text>
  <text x="22" y="162" class="mono"><tspan class="dim">│</tspan> <tspan class="key">Small Files (&lt;32MB) / Skew</tspan>  <tspan class="dim">│</tspan> <tspan class="warn">10 (71.4%) · skew score 0.85 / 1.0</tspan>                                   <tspan class="dim">│</tspan></text>
  <text x="22" y="180" class="mono"><tspan class="dim">│</tspan> <tspan class="key">Deletion Vectors</tspan>            <tspan class="dim">│</tspan> <tspan class="val">1 file (1,420 deleted rows)  ·  Liquid Clustering: customer_id, txn</tspan>  <tspan class="dim">│</tspan></text>
  <text x="22" y="198" class="mono"><tspan class="dim">│</tspan> <tspan class="key">Checkpoints &amp; Tombstones</tspan>    <tspan class="dim">│</tspan> <tspan class="val">Last CHECKPOINT v010 · 3 tombstones (228.6 MB reclaimable)</tspan>           <tspan class="dim">│</tspan></text>
  <text x="22" y="216" class="mono dim">└─────────────────────────────┴──────────────────────────────────────────────────────────────────────┘</text>
  <text x="22" y="238" class="mono warn">WARN: 2 issues detected: high file-size skew (0.85) · 71.4% small files (&lt;32 MB)</text>

  <!-- Divider -->
  <line x1="22" y1="262" x2="898" y2="262" stroke="#1f2937" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- Command 2: diff --fail-on-breaking -->
  <text x="22" y="290" class="mono"><tspan class="prompt">$</tspan> <tspan class="cmd">deltalens diff s3://warehouse/transactions --v1 10 --v2 12 --fail-on-breaking</tspan></text>
  <text x="22" y="314" class="mono dim">┌─────────────────────────────┬──────────────────────────────────────────────────────────────────────┐</text>
  <text x="22" y="332" class="mono"><tspan class="dim">│</tspan> <tspan class="hdr">SCHEMA CHANGES (v010 → v012)</tspan><tspan class="dim">│</tspan> <tspan class="key">Recursive struct/array/map diff + Column Mapping rename detection</tspan>    <tspan class="dim">│</tspan></text>
  <text x="22" y="350" class="mono dim">├─────────────────────────────┼──────────────────────────────────────────────────────────────────────┤</text>
  <text x="22" y="368" class="mono"><tspan class="dim">│</tspan> <tspan class="ok">+ added</tspan>                     <tspan class="dim">│</tspan> <tspan class="ok">currency (string, nullable)</tspan>                                          <tspan class="dim">│</tspan></text>
  <text x="22" y="386" class="mono"><tspan class="dim">│</tspan> <tspan class="err">- removed [BREAKING]</tspan>        <tspan class="dim">│</tspan> <tspan class="err">legacy_code</tspan>                                                          <tspan class="dim">│</tspan></text>
  <text x="22" y="404" class="mono"><tspan class="dim">│</tspan> <tspan class="err">→ renamed [BREAKING]</tspan>        <tspan class="dim">│</tspan> <tspan class="err">customer_id → account_id</tspan> <tspan class="dim">(via delta.columnMapping.id)</tspan>               <tspan class="dim">│</tspan></text>
  <text x="22" y="422" class="mono"><tspan class="dim">│</tspan> <tspan class="err">~ modified [BREAKING]</tspan>       <tspan class="dim">│</tspan> <tspan class="err">amount (double → integer, nullable true → false)</tspan>                     <tspan class="dim">│</tspan></text>
  <text x="22" y="440" class="mono dim">├─────────────────────────────┼──────────────────────────────────────────────────────────────────────┤</text>
  <text x="22" y="458" class="mono"><tspan class="dim">│</tspan> <tspan class="key">Data / Operations</tspan>           <tspan class="dim">│</tspan> <tspan class="val">Files +3 / -1 (net +109.1 MB) · MERGE (1), WRITE (1)</tspan>                <tspan class="dim">│</tspan></text>
  <text x="22" y="476" class="mono dim">└─────────────────────────────┴──────────────────────────────────────────────────────────────────────┘</text>
  <text x="22" y="500" class="mono err">CI GATE TRIGGERED — exits with code 2 (3 breaking schema changes detected in 2.60 ms)</text>

  <!-- Footer bar -->
  <rect x="0" y="522" width="920" height="38" rx="0" fill="#161b22"/>
  <line x1="0" y1="522" x2="920" y2="522" stroke="#30363d" stroke-width="1"/>
  <text x="22" y="545" class="mono dim">Measured vs deltalake (delta-rs Py): <tspan class="ok">19.4× faster cold CLI</tspan> · <tspan class="ok">12.9×–31.4× less RAM</tspan> · <tspan class="val">cargo install deltalens</tspan></text>
</svg>
