[package]
name = "deltalens"
version = "1.1.0"
edition = "2021"
description = "Standalone CLI to inspect Delta Lake tables without Spark, JVM, or Python"
license = "MIT"
repository = "https://github.com/sandy-sachin7/datalens"
readme = "README.md"
keywords = ["delta-lake", "databricks", "data-engineering", "observability", "cli"]
categories = ["command-line-utilities", "development-tools"]
include = ["src/**", "tests/**", "Cargo.toml", "Cargo.lock", "README.md", "LICENSE"]

[lib]
name = "deltalens"
path = "src/lib.rs"

[[bin]]
name = "deltalens"
path = "src/main.rs"

[features]
default = ["aws", "gcp", "azure"]
cloud = ["dep:object_store", "dep:tokio", "dep:futures"]
aws = ["cloud", "object_store/aws"]
gcp = ["cloud", "object_store/gcp"]
azure = ["cloud", "object_store/azure"]

[dependencies]
# CLI
clap = { version = "4", features = ["derive", "color"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Parallelism — core performance lever
rayon = "1"

# Terminal rendering
comfy-table = "7.0.1"
colored = "2"

# Time handling
chrono = { version = "0.4", features = ["serde"] }

# Error handling
thiserror = "1"

# Human readable sizes
bytesize = "1"

# Parquet checkpoint reading (classic, multi-part, V2 & sidecars)
bytes = "1"
arrow-array = { version = "53", default-features = false }
arrow-schema = { version = "53", default-features = false }
parquet = { version = "53", default-features = false, features = ["arrow", "snap", "zstd", "flate2", "lz4"] }

# Object storage support (S3, GCS, Azure) — feature-gated
object_store = { version = "0.11", default-features = false, optional = true }
tokio = { version = "1", features = ["rt", "rt-multi-thread"], optional = true }
futures = { version = "0.3", optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
tempfile = "3"
assert_cmd = "2"
predicates = "3"

[[bench]]
name = "log_parsing"
harness = false

[profile.release]
lto = true
codegen-units = 1
strip = true
